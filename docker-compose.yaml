version: '3.8'
services:
  dev-database:
    image: postgres:15.0
    container_name: dev-database
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Abc123456789
      POSTGRES_DB: ptmdb
    networks:
      - nestjs-network
  # Create test container
  test-database:
    image: postgres:15.0
    container_name: test-database
    ports:
      - 5435:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Abc123456789
      POSTGRES_DB: ptmdb_test
    networks:
      - nestjs-network
networks:
  nestjs-network:
